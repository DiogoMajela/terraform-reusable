name: Terraform Destroy Plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Diretorio onde estão os arquivos terraform"
        default: iac
        type: string
      action:
        description: "Escolha o que acontece no run deste workflow"
        type: string
        default: apply
    secrets:
      AWS_ROLE_TO_ASSUME:
        description: "Role da AWS para OIDC"
        required: true

jobs:
  terraform-destroy-plan:
    name: Terraform Destroy Plan
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
    
    env:
      AWS_REGION: us-east-1
      TF_PLAN_FILE: tfdestroy
      ARTIFACT_NAME: terraform-destroy
    
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
      
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws_region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      
      - name: Terraform init
        run: terraform -chdir=${{ inputs.working_directory }} init -input=false

      - name: Terraform Plan -destroy
        id: plan_destroy
        run: |
          terraform -chdir=${{ inputs.working_directory }} plan -destroy -input=false -out="${{ env.TF_PLAN_FILE }}"
      
      - name: Upload artifacts to destroy
        if: ${{ steps.plan_destroy.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ inputs.working_directory }}/${{ env.TF_PLAN_FILE }}
          retention-days: 7

  deploy_apply:
    name: Terraform Destroy Apply
    needs: terraform-destroy-plan
    if: ${{ needs.terraform-destroy-plan.result == 'success'}}
    uses: DiogoMajela/terraform-reusable/.github/workflows/terraform-destroy-apply.yml@main
    with:
      working-directory: ${{ inputs.working_directory }}
    secrets: 
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}


